<html lang="es">
<head>
<meta charset="utf-8">

<title>Noche de guardia · Simulador docente de urgencias oftalmológicas</title>
<meta name="description" content="Siete guardias ficticias de oftalmología. Información incompleta y una IA que se equivoca a propósito. Prototipo docente para residentes.">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Cellipse cx='32' cy='32' rx='22' ry='13' fill='none' stroke='%23f5b942' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23f5b942'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b1020; --bg2:#111831; --card:#151d38; --card2:#1b2546; --line:#27325a;
  --ink:#eef1fb; --mute:#a3acc9; --dim:#7680a3;
  --amber:#f5b942; --amber-ink:#2a1d00;
  --ok:#3ecf8e; --ok-bg:rgba(62,207,142,.12);
  --mid:#f5b942; --mid-bg:rgba(245,185,66,.12);
  --bad:#ff6b6b; --bad-bg:rgba(255,107,107,.12);
  --ai:#9b8cff; --ai-bg:rgba(155,140,255,.12);
  --r:16px;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.proj{font-size:20px}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1a2350 0%,transparent 60%),var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--amber)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em;font-size:.82rem;text-transform:uppercase;background:none;border:0;padding:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 rgba(245,185,66,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,185,66,.55)}70%{box-shadow:0 0 0 10px rgba(245,185,66,0)}100%{box-shadow:0 0 0 0 rgba(245,185,66,0)}}
.orglogo{height:30px;width:auto;background:#fff;border-radius:7px;padding:3px 7px;display:block}
.hero-logo{height:46px;width:auto;background:#fff;border-radius:10px;padding:6px 10px;display:block;margin:0 0 18px}
@media (max-width:560px){header.top .orglogo{display:none}}
.spacer{flex:1}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.8rem;color:var(--mute)}
.iconbtn[aria-pressed=true]{color:var(--amber-ink);background:var(--amber);border-color:var(--amber)}
.demo-banner{display:none;background:var(--ai);color:#120c3a;text-align:center;font-weight:700;font-size:.85rem;padding:8px}
.demo-banner.on{display:block}

/* home */
.hero{padding:40px 0 18px}
.kicker{font-family:var(--mono);font-size:.75rem;color:var(--amber);letter-spacing:.06em;text-transform:uppercase}
h1{font-size:clamp(1.9rem,6.5vw,2.9rem);line-height:1.08;margin:.35em 0 .45em;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--amber)}
.lead{color:var(--mute);font-size:1.05rem;max-width:36em}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 6px}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--amber);color:var(--amber-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.block{width:100%;justify-content:center}
.small{font-size:.82rem;color:var(--dim)}
h2{font-size:1.25rem;margin:38px 0 12px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.casecard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s;position:relative}
.casecard:hover{transform:translateY(-2px);border-color:var(--amber)}
.casecard .t{font-family:var(--mono);color:var(--amber);font-size:.85rem}
.casecard .a{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-left:8px}
.casecard h3{margin:6px 0 2px;font-size:1.05rem}
.casecard .done{position:absolute;top:14px;right:14px;font-size:.75rem;font-family:var(--mono);color:var(--ok)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.skill{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px}
.skill b{display:block;margin-bottom:2px}
.skill span{color:var(--mute);font-size:.88rem}
.rules{background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:14px 16px}
.rules ul{margin:0;padding-left:18px;color:var(--mute)}
.rules li{margin:4px 0}
.prompt{background:#0a0f1e;border:1px solid var(--line);border-radius:12px;padding:14px;font-family:var(--mono);font-size:.8rem;white-space:pre-wrap;color:#cfd5ec;max-height:260px;overflow:auto}
.steps-made{counter-reset:s;list-style:none;padding:0;margin:0}
.steps-made li{counter-increment:s;position:relative;padding:8px 0 8px 40px;color:var(--mute);border-bottom:1px dashed var(--line)}
.steps-made li::before{content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--card2);color:var(--amber);font-family:var(--mono);font-size:.8rem;display:grid;place-items:center}
.steps-made b{color:var(--ink)}
footer{margin:40px 0 30px;color:var(--dim);font-size:.8rem}
.status{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:3px 8px;border-radius:6px;background:var(--mid-bg);color:var(--mid);border:1px solid rgba(245,185,66,.35)}

/* case */
.casebar{display:flex;align-items:center;gap:10px;padding:14px 0 8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.78rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--mute)}
.chip.clock{color:var(--amber);border-color:rgba(245,185,66,.4)}
.prog{display:flex;gap:4px;margin:2px 0 14px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--amber)}
.prog i.cur{background:linear-gradient(90deg,var(--amber),var(--line))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card h3{margin:0 0 4px;font-size:1.15rem}
.card .q{color:var(--mute);margin:0 0 14px}
.pager{background:linear-gradient(135deg,#1d2650,#141b37);border:1px solid #33407a}
.pager .bip{font-family:var(--mono);color:var(--amber);font-size:.8rem;letter-spacing:.08em}
.pager .msg{font-size:1.15rem;font-weight:700;margin:8px 0 12px}
.patient{background:rgba(0,0,0,.2);border-radius:12px;padding:12px 14px;color:var(--ink)}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:#4a5893}
.opt .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #4a5893;display:grid;place-items:center;font-size:.8rem;margin-top:1px}
.opt.radio .box{border-radius:50%}
.opt.sel{border-color:var(--amber);background:rgba(245,185,66,.08)}
.opt.sel .box{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.mid{border-color:var(--mid);background:var(--mid-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.faded{opacity:.55}
.opt .body{flex:1}
.res{margin-top:6px;font-size:.92rem;color:var(--ink)}
.note{margin-top:4px;font-size:.85rem;color:var(--mute)}
.tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-right:6px;vertical-align:1px}
.tag.key{background:var(--ok-bg);color:var(--ok)}
.tag.useful{background:rgba(120,170,255,.14);color:#8fb5ff}
.tag.neutral{background:rgba(160,170,200,.12);color:var(--mute)}
.tag.harm{background:var(--bad-bg);color:var(--bad)}
.counter{font-family:var(--mono);font-size:.8rem;color:var(--dim);margin:10px 0 0}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.missed{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.missed h4{margin:0 0 8px;font-size:.9rem;color:var(--ok)}
.ai{border-color:rgba(155,140,255,.45);background:linear-gradient(180deg,rgba(155,140,255,.08),transparent 60%),var(--card)}
.ai .who{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ai);font-size:.9rem}
.ai .who .bot{width:26px;height:26px;border-radius:8px;background:var(--ai-bg);display:grid;place-items:center}
.ai .conf{font-family:var(--mono);font-size:.72rem;color:var(--dim);margin-left:auto}
.ai .task{margin:12px 0;font-weight:700}
.conf-row{margin-top:14px}
.conf-row .lbl{font-size:.85rem;color:var(--mute);margin-bottom:6px}
.confs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.confs button{background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;padding:8px 0;font-family:var(--mono);font-weight:700}
.confs button.sel{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.confs-legend{display:flex;justify-content:space-between;font-size:.72rem;color:var(--dim);margin-top:4px}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px}
.fb.ok{background:var(--ok-bg);border:1px solid rgba(62,207,142,.4)}
.fb.mid{background:var(--mid-bg);border:1px solid rgba(245,185,66,.4)}
.fb.bad{background:var(--bad-bg);border:1px solid rgba(255,107,107,.4)}
.fb b{display:block;margin-bottom:2px}
.isbar{display:grid;gap:6px;margin-top:12px}
.isbar div{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border-radius:10px;padding:8px 10px}
.isbar .L{flex:none;width:26px;height:26px;border-radius:7px;background:var(--amber);color:var(--amber-ink);font-weight:800;display:grid;place-items:center;font-family:var(--mono)}
.score{display:flex;align-items:baseline;gap:8px}
.score .n{font-size:2.6rem;font-weight:800;font-family:var(--mono);color:var(--amber);line-height:1}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#ffd98a)}
.cols{display:grid;gap:10px;grid-template-columns:1fr;margin-top:6px}
@media(min-width:620px){.cols{grid-template-columns:1fr 1fr}}
.col{background:var(--bg2);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.col h4{margin:0 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.col ul{margin:0;padding-left:18px;color:var(--ink)}
.col li{margin:3px 0;font-size:.93rem}
.col.k h4{color:var(--ok)} .col.a h4{color:var(--ai)} .col.r{border-color:rgba(255,107,107,.35)} .col.r h4{color:var(--bad)}
.col.r{grid-column:1/-1}
.pearl{background:linear-gradient(135deg,rgba(245,185,66,.14),rgba(245,185,66,.04));border:1px solid rgba(245,185,66,.35);border-radius:12px;padding:12px 14px;margin-top:10px}
.calib{margin-top:10px;font-size:.92rem;color:var(--mute)}
.calib b{color:var(--ink)}
.flash{outline:3px solid var(--ai);outline-offset:2px;transition:outline .2s}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ok);color:#03281a;font-weight:700;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" data-act="home" aria-label="Inicio"><span class="dot"></span>Noche de guardia</button>
    <span class="spacer"></span>
    <img class="orglogo" src="../assets/logo-centro-ojos-coruna.png" alt="Centro de Ojos de La Coruña" width="640" height="149">
    <button class="iconbtn" id="projBtn" aria-pressed="false" title="Letra grande para proyectar">A+</button>
    <button class="iconbtn" data-act="home">Inicio</button>
  </div>
  <div class="demo-banner" id="demoBanner" role="status">Demo automática · toca la pantalla para detenerla</div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="toast" id="toast"></div>

<script>
// Casos 100 % ficticios. Sin dosis. Revisión clínica independiente pendiente.
// tag: key (clave) | useful (útil) | neutral (no aporta ahora) | harm (perjudicial)
window.CASES = [
{
  id: "glaucoma", area: "Glaucoma", time: "02:40", box: "Box 3",
  title: "Cefalea con vómitos",
  pager: "Te la deriva urgencias generales: «cefalea intensa con vómitos, el ojo derecho muy rojo».",
  patient: "Mujer, 67 años. Dolor intenso en el ojo derecho desde hace 3 horas, visión borrosa, náuseas y un vómito. TA 165/95.",
  steps: [
    { type: "ask", title: "Anamnesis dirigida", prompt: "Tienes tiempo para tres preguntas. ¿Cuáles haces?", max: 3, items: [
      { label: "¿Ve halos de colores alrededor de las luces?", result: "Sí, desde la tarde, al salir del cine.", tag: "key", note: "Halos por edema corneal. Y la penumbra del cine dilata la pupila: desencadenante clásico." },
      { label: "¿Usa gafas? ¿De lejos o de cerca?", result: "Gafas de lejos «muy gordas» desde joven. Hipermétrope de +5.", tag: "key", note: "Ojo corto, cámara estrecha: el terreno del cierre angular." },
      { label: "¿Ha empezado algún medicamento?", result: "Un antigripal desde ayer.", tag: "useful", note: "Algunos antigripales llevan antihistamínicos o simpaticomiméticos que pueden favorecer el cierre." },
      { label: "¿Tiene migraña?", result: "Alguna cefalea tensional. Nunca así.", tag: "neutral", note: "No cambia lo que tienes que hacer ahora." },
      { label: "¿La han operado de cataratas?", result: "No.", tag: "useful", note: "Sigue siendo fáquica: el cristalino forma parte del problema." },
      { label: "¿Toma anticoagulantes?", result: "No.", tag: "neutral", note: "No es lo urgente en este cuadro." }
    ]},
    { type: "ask", title: "Exploración", prompt: "Elige tres exploraciones.", max: 3, items: [
      { label: "Tonometría", result: "OD 58 mmHg. OI 16 mmHg.", tag: "key", note: "El dato que lo cambia todo." },
      { label: "Biomicroscopía", result: "OD: inyección ciliar, edema corneal microquístico, cámara anterior muy estrecha, pupila en midriasis media arreactiva.", tag: "key", note: "La tríada del cierre angular agudo." },
      { label: "Ángulo del ojo adelfo (Van Herick / gonioscopia)", result: "OI: ángulo estrecho, potencialmente ocluible.", tag: "key", note: "El otro ojo tiene el mismo riesgo." },
      { label: "Agudeza visual", result: "OD 0,1. OI 0,8.", tag: "useful", note: "Útil para documentar, no decide el tratamiento." },
      { label: "Dilatar para ver el fondo de ojo", result: "No es buena idea ahora.", tag: "harm", note: "La midriasis puede empeorar el cierre y desencadenarlo en el ojo adelfo. El fondo se valora cuando la córnea se aclare." },
      { label: "Pedir TC craneal", result: "Sin hallazgos agudos (tras 2 horas de espera).", tag: "harm", note: "El cuadro ocular explica los síntomas. Pedirlo retrasa el tratamiento." }
    ]},
    { type: "ai", intro: "El asistente de IA del hospital (ficticio) resume el caso:", claims: [
      "Cuadro compatible con cierre angular agudo primario en el ojo derecho.",
      "La hipermetropía y la cámara estrecha son factores de riesgo.",
      "Antes de tratar, dilata ambos ojos para valorar el nervio óptico.",
      "El ojo izquierdo también está en riesgo y hay que tratarlo."
    ], wrong: 2, contradiction: "Pupila en midriasis media y ángulo ocluible en el adelfo.", explain: "Dilatar puede empeorar el cierre en el ojo derecho y provocarlo en el izquierdo. El nervio óptico puede esperar; la PIO no." },
    { type: "decide", title: "Primera decisión", question: "¿Qué haces primero?", options: [
      { text: "Bajar la PIO con tratamiento médico tópico y sistémico según el protocolo del centro, con analgesia y antiemético.", score: 2, fb: "Correcto. Primero baja la presión y aclara la córnea." },
      { text: "Iridotomía láser inmediata.", score: 1, fb: "Es el tratamiento definitivo, pero con la córnea edematosa no suele ser técnicamente posible. Primero, tratamiento médico." },
      { text: "Remitir a neurología por cefalea con vómitos.", score: 0, fb: "El ojo explica todo el cuadro. Cada hora con 58 mmHg daña el nervio óptico." },
      { text: "Colirio de corticoide y revisión mañana.", score: 0, fb: "Trata la inflamación y deja sin tratar la presión." }
    ]},
    { type: "decide", title: "Segunda decisión", question: "Una hora después: PIO de 24 mmHg en el OD y córnea más clara. ¿Plan?", options: [
      { text: "Iridotomía láser en el OD en cuanto la córnea lo permita, y profiláctica en el OI.", score: 2, fb: "Correcto. Resuelves el bloqueo pupilar y proteges el ojo adelfo." },
      { text: "Iridotomía solo en el OD; el OI no tiene síntomas.", score: 1, fb: "Te falta el ojo adelfo, que tiene un riesgo alto de sufrir un ataque en los próximos años." },
      { text: "Valorar con el adjunto la extracción del cristalino.", score: 1, fb: "Es una opción válida (estudio EAGLE), sobre todo con catarata o cristalino grueso. Lo urgente es asegurar los dos ojos." },

    { type: "isbar", prompt: "Llamas al adjunto a las 3 de la mañana. Tienes 30 segundos. ¿Qué tres datos le das?", pick: 3, items: [
      { text: "PIO de 58 mmHg en el OD que baja a 24 con tratamiento médico", key: true },
      { text: "Edema corneal, cámara estrecha y pupila arreactiva", key: true },
      { text: "Ángulo ocluible en el ojo izquierdo", key: true },
      { text: "TA 165/95", key: false },
      { text: "Toma un antigripal desde ayer", key: false },
      { text: "Ha vomitado una vez", key: false },
      { text: "Le duele desde que salió del cine", key: false }
    ], model: [
      ["I", "Soy el R4 de guardia. Te llamo por una paciente de 67 años en el box 3."],
      ["S", "Cierre angular agudo en el OD: PIO de 58 mmHg."],
      ["B", "Hipermétrope de +5, fáquica. Empezó tras estar en un cine a oscuras."],
      ["A", "Con tratamiento médico baja a 24 y la córnea se aclara. El OI tiene el ángulo ocluible."],
      ["R", "Te propongo iridotomía láser bilateral en cuanto la córnea lo permita. ¿Lo hacemos esta noche o a primera hora?"]
    ]},
  ],
  debrief: {
    knew: ["PIO de 58 mmHg con cámara estrecha y edema corneal.", "Ángulo ocluible en el ojo adelfo."],
    assumed: ["Que el desencadenante fue la penumbra del cine o el antigripal: es plausible, pero no está demostrado."],
    redflags: ["Cefalea y vómitos con ojo rojo: mide la PIO antes de pensar en el cerebro.", "Nunca dilates un ojo con sospecha de cierre angular.", "Trata siempre el ojo adelfo."],
    pearl: "Sin tratamiento, entre el 40 y el 80 % de los ojos adelfos sufren un ataque en los 5–10 años siguientes. La iridotomía profiláctica es parte del tratamiento, no un extra."
  }
},
{
  id: "cornea", area: "Córnea", time: "04:05", box: "Box 1",
  title: "Ojo rojo en portador de lentillas",
  pager: "Triaje: «ojo rojo con dolor, lleva lentillas».",
  patient: "Hombre, 24 años. Ojo izquierdo rojo y doloroso desde ayer, fotofobia, «veo como empañado». Lentes de contacto mensuales.",
  steps: [
    { type: "ask", title: "Anamnesis dirigida", prompt: "Tres preguntas.", max: 3, items: [

  app.innerHTML=head+body;
}
function next(){ S.si++; S.ui={}; renderCase(); scrollTop(); }

function renderIntro(c){
  return '<div class="card pager"><div class="bip">BIP · BIP · '+c.time+'</div>'+
    '<div class="msg">'+esc(c.pager)+'</div><div class="patient">'+esc(c.patient)+'</div>'+
    '<div class="actions"><button class="btn primary" data-act="next">Atender →</button></div></div>';
}

var TAGNAME={key:"Clave",useful:"Útil",neutral:"No aporta ahora",harm:"Perjudicial"};
var R={};
R.ask=function(st){
  var u=S.ui; u.sel=u.sel||[];
  var items=st.items.map(function(it,i){
    var sel=u.sel.indexOf(i)>-1;
    if(!u.done){
      return '<button class="opt'+(sel?" sel":"")+'" data-item="'+i+'"><span class="box">'+(sel?"✓":"")+'</span><span class="body">'+esc(it.label)+'</span></button>';
    }
    if(!sel) return "";
    var cls=it.tag==="key"?"ok":(it.tag==="harm"?"bad":(it.tag==="useful"?"":"faded"));
    return '<div class="opt '+cls+'" role="group"><span class="body"><span class="tag '+it.tag+'">'+TAGNAME[it.tag]+'</span>'+esc(it.label)+
      '<div class="res">'+esc(it.result)+'</div><div class="note">'+esc(it.note)+'</div></span></div>';
  }).join("");
  var extra="";
  if(u.done){
    var missed=st.items.filter(function(it,i){return it.tag==="key"&&u.sel.indexOf(i)<0;});
    if(missed.length){
      extra='<div class="missed"><h4>Lo clave que no elegiste</h4>'+missed.map(function(it){
        return '<div class="note"><b style="color:var(--ink)">'+esc(it.label)+'</b> → '+esc(it.result)+'</div>';}).join("")+'</div>';
    } else extra='<div class="fb ok"><b>Has elegido todo lo clave.</b></div>';
  }
  return '<div class="card"><h3>'+esc(st.title)+'</h3><p class="q">'+esc(st.prompt)+'</p><div class="opts">'+items+'</div>'+
    (!u.done?'<div class="counter">'+u.sel.length+' de '+st.max+'</div>':'')+extra+
    '<div class="actions">'+(!u.done?'<button class="btn primary" data-act="reveal" '+(u.sel.length?"":"disabled")+'>Ver respuestas</button>':'<button class="btn primary" data-act="next">Continuar →</button>')+'</div></div>';
};
function confRow(){
  var c=S.ui.conf||0, b="";
  for(var n=1;n<=5;n++) b+='<button data-conf="'+n+'" class="'+(c===n?"sel":"")+'" aria-label="Confianza '+n+'">'+n+'</button>';
  return '<div class="conf-row"><div class="lbl">¿Cuánta seguridad tienes?</div><div class="confs">'+b+'</div><div class="confs-legend"><span>Lo dudo</span><span>Seguro</span></div></div>';
}
R.ai=function(st){
  var u=S.ui;
  var claims=st.claims.map(function(t,i){
    var cls="opt radio";
    if(u.done){ cls+= i===st.wrong?" bad":(i===u.pick?" mid":" faded"); }
    else if(u.pick===i) cls+=" sel";
    return '<button class="'+cls+'" data-claim="'+i+'" '+(u.done?"disabled":"")+'><span class="box">'+(u.pick===i&&!u.done?"●":"")+'</span><span class="body">'+esc(t)+
      (u.done&&i===st.wrong?'<div class="note" style="color:var(--bad)">Esta es la afirmación falsa.</div>':'')+'</span></button>';
  }).join("");
  var fb="";
  if(u.done){
    var ok=u.pick===st.wrong;
    fb='<div class="fb '+(ok?"ok":"bad")+'"><b>'+(ok?"¡La has pillado!":"Se te ha colado.")+'</b>'+
      '<div><b style="display:inline">Dato que la contradice:</b> '+esc(st.contradiction)+'</div><div class="note" style="color:var(--ink)">'+esc(st.explain)+'</div></div>';
  }
  return '<div class="card ai"><div class="who"><span class="bot">✦</span>Asistente de IA (simulado)<span class="conf">confianza: «alta»</span></div>'+
    '<p class="q" style="margin-top:8px">'+esc(st.intro)+'</p><div class="task">Una afirmación es falsa. ¿Cuál?</div><div class="opts">'+claims+'</div>'+
    (!u.done?confRow():"")+fb+
    '<div class="actions">'+(!u.done?'<button class="btn primary" data-act="check" '+(u.pick!=null&&u.conf?"":"disabled")+'>Comprobar</button>':'<button class="btn primary" data-act="next">Continuar →</button>')+'</div></div>';
};
R.decide=function(st){
  var u=S.ui;
  var opts=st.options.map(function(o,i){
    var cls="opt radio";
    if(u.done){ cls+= o.score===2?" ok":(o.score===1?" mid":(i===u.pick?" bad":" faded")); }
    else if(u.pick===i) cls+=" sel";
    return '<button class="'+cls+'" data-opt="'+i+'" '+(u.done?"disabled":"")+'><span class="box">'+(u.pick===i?"●":"")+'</span><span class="body">'+esc(o.text)+
      (u.done&&(i===u.pick||o.score>0)?'<div class="note">'+esc(o.fb)+'</div>':'')+'</span></button>';
  }).join("");
  var fb="";
  if(u.done){
    var o=st.options[u.pick];
    fb='<div class="fb '+(o.score===2?"ok":(o.score===1?"mid":"bad"))+'"><b>'+(o.score===2?"Bien decidido.":(o.score===1?"Razonable, pero hay una opción mejor.":"No es la mejor opción."))+'</b>'+esc(o.fb)+'</div>';
  }
  return '<div class="card"><h3>'+esc(st.title)+'</h3><p class="q">'+esc(st.question)+'</p><div class="opts">'+opts+'</div>'+
    (!u.done?confRow():"")+fb+
    '<div class="actions">'+(!u.done?'<button class="btn primary" data-act="confirm" '+(u.pick!=null&&u.conf?"":"disabled")+'>Confirmar</button>':'<button class="btn primary" data-act="next">Continuar →</button>')+'</div></div>';
};
R.isbar=function(st){
  var u=S.ui; u.sel=u.sel||[];
  var items=st.items.map(function(it,i){
    var sel=u.sel.indexOf(i)>-1, cls="opt";
    if(u.done){ cls+= it.key?" ok":(sel?" bad":" faded"); }
    else if(sel) cls+=" sel";
    return '<button class="'+cls+'" data-isb="'+i+'" '+(u.done?"disabled":"")+'><span class="box">'+(sel?"✓":"")+'</span><span class="body">'+esc(it.text)+'</span></button>';
  }).join("");
  var fb="";
  if(u.done){
    var hits=u.sel.filter(function(i){return st.items[i].key;}).length;
    fb='<div class="fb '+(hits===3?"ok":(hits===2?"mid":"bad"))+'"><b>'+hits+' de 3 datos imprescindibles.</b>Así podría sonar la llamada:</div>'+
      '<div class="isbar">'+st.model.map(function(m){return '<div><span class="L">'+m[0]+'</span><span>'+esc(m[1])+'</span></div>';}).join("")+'</div>';
  }
  return '<div class="card"><h3>📞 Llamada al adjunto</h3><p class="q">'+esc(st.prompt)+'</p><div class="opts">'+items+'</div>'+
    (!u.done?'<div class="counter">'+u.sel.length+' de '+st.pick+'</div>':'')+fb+
    '<div class="actions">'+(!u.done?'<button class="btn primary" data-act="call" '+(u.sel.length===st.pick?"":"disabled")+'>Llamar</button>':'<button class="btn primary" data-act="next">Ver el debriefing →</button>')+'</div></div>';
};

function calibText(conf){
  var hi=conf.filter(function(x){return x.c>=4;}), lo=conf.filter(function(x){return x.c<=2;});
  var t=[];
  if(hi.length){var h=hi.filter(function(x){return x.ok;}).length; t.push('Cuando estabas seguro (4–5) acertaste <b>'+h+' de '+hi.length+'</b>.');}
  if(lo.length){var l=lo.filter(function(x){return x.ok;}).length; t.push('Cuando dudabas (1–2) acertaste <b>'+l+' de '+lo.length+'</b>.');}
  if(!t.length) t.push('Tus respuestas estuvieron en seguridad media (3).');
  var wrongSure=hi.filter(function(x){return !x.ok;}).length;
  if(wrongSure) t.push('Ojo con los errores con mucha seguridad: en la guardia son los más peligrosos.');
  else if(hi.length) t.push('Buena calibración.');
  return t.join(" ");
}
function renderDebrief(c){
  var r=res(), d=c.debrief, pct=r.max?Math.round(100*r.pts/r.max):0;
  var li=function(a){return a.map(function(x){return '<li>'+esc(x)+'</li>';}).join("");};
  var last=S.mode==="full"&&S.ci===CASES.length-1;
  var nextBtn=S.mode==="full"? (last?'<button class="btn primary" data-act="summary">Ver el resumen de la guardia →</button>':'<button class="btn primary" data-act="nextcase">Siguiente llamada →</button>')
    :'<button class="btn primary" data-act="home">Elegir otra llamada</button>';
  return '<div class="card"><h3>Debriefing</h3><div class="score"><span class="n">'+r.pts+'</span><span class="small">de '+r.max+' puntos</span></div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="calib">'+calibText(r.conf)+'</div></div>'+
    '<div class="cols"><div class="col k"><h4>Lo que sabías</h4><ul>'+li(d.knew)+'</ul></div>'+
    '<div class="col a"><h4>Lo que suponías</h4><ul>'+li(d.assumed)+'</ul></div>'+
    '<div class="col r"><h4>Lo que no te puedes perder</h4><ul>'+li(d.redflags)+'</ul></div></div>'+
    '<div class="pearl"><b>Perla · </b>'+esc(d.pearl)+'</div>'+
    '<div class="actions">'+nextBtn+'<button class="btn ghost" data-act="retry">Repetir</button><button class="btn ghost" data-act="download">Descargar resumen</button></div>';
}

/* ---------- SUMMARY ---------- */
function renderSummary(){
  S.view="summary";
  var pts=0,max=0,conf=[];
  var rows=CASES.map(function(c){var r=S.results[c.id]; if(!r) return ""; pts+=r.pts;max+=r.max;conf=conf.concat(r.conf);
    return '<div class="opt" role="group"><span class="body"><b>'+esc(c.area)+'</b> · '+esc(c.title)+'</span><span style="font-family:var(--mono);color:var(--amber)">'+r.pts+'/'+r.max+'</span></div>';}).join("");
  var aiHits=CASES.filter(function(c){var r=S.results[c.id];return r&&r.aiOk;}).length;
  app.innerHTML='<div class="casebar"><span class="chip clock">08:00</span><span class="chip">Fin de la guardia</span></div>'+
    '<div class="card"><h3>Saliente de guardia</h3><div class="score"><span class="n">'+pts+'</span><span class="small">de '+max+' puntos</span></div>'+
    '<div class="bar"><i style="width:'+(max?Math.round(100*pts/max):0)+'%"></i></div>'+
    '<div class="calib">Has pillado a la IA <b>'+aiHits+' de '+CASES.length+'</b> veces. '+calibText(conf)+'</div></div>'+
    '<div class="opts">'+rows+'</div>'+
    '<div class="pearl" style="margin-top:14px"><b>La idea de fondo · </b>La IA puede resumir con mucha seguridad y equivocarse en el dato que importa. La decisión y la firma siguen siendo tuyas.</div>'+
    '<div class="actions"><button class="btn primary" data-act="download">Descargar resumen</button><button class="btn ghost" data-act="home">Inicio</button></div>';
  scrollTop();
}

function download(){
  var lines=["NOCHE DE GUARDIA · Resumen ("+new Date().toLocaleString("es-ES")+")","Casos ficticios. Herramienta docente.",""];
  CASES.forEach(function(c){var r=S.results[c.id]; if(!r) return;
    lines.push(c.area.toUpperCase()+" · "+c.title+": "+r.pts+"/"+r.max+" puntos");
    r.log.forEach(function(l){lines.push("  - "+l);});
    lines.push("  No te puedes perder:"); c.debrief.redflags.forEach(function(x){lines.push("    · "+x);}); lines.push("");});
  var blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="noche-de-guardia-resumen.txt";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function copyPrompt(){
  function ok(){toast("Prompt copiado");}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(PROMPT).then(ok,fallback);} else fallback();
  function fallback(){var ta=document.createElement("textarea");ta.value=PROMPT;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");ok();}catch(e){toast("Selecciónalo y cópialo a mano");} ta.remove();}
}

/* ---------- EVENTS ---------- */
document.addEventListener("click",function(e){
  if(S.demo && e.isTrusted){ stopDemo(); return; }
  var t=e.target.closest("button"); if(!t) return;
  var d=t.dataset, u=S.ui, c=CASES[S.ci], st=(S.view==="case"&&S.si>=0)?c.steps[S.si]:null;
  if(d.case!=null){ startCase(+d.case,"single"); return; }
  if(d.item!=null && st){ var i=+d.item, k=u.sel.indexOf(i); if(k>-1)u.sel.splice(k,1); else if(u.sel.length<st.max)u.sel.push(i); else {toast("Máximo "+st.max);return;} renderCase(); return; }
  if(d.isb!=null && st){ var j=+d.isb, m=u.sel.indexOf(j); if(m>-1)u.sel.splice(m,1); else if(u.sel.length<st.pick)u.sel.push(j); else {toast("Solo "+st.pick+" datos");return;} renderCase(); return; }
  if(d.claim!=null){ u.pick=+d.claim; renderCase(); return; }
  if(d.opt!=null){ u.pick=+d.opt; renderCase(); return; }
  if(d.conf!=null){ u.conf=+d.conf; renderCase(); return; }
  var r=S.view==="case"?res():null;
  switch(d.act){
    case "home": stopDemo(); renderHome(); scrollTop(); break;
    case "full": S.results={}; startCase(0,"full"); break;
    case "demo": runDemo(); break;
    case "copy": copyPrompt(); break;
    case "next": next(); break;
    case "nextcase": startCase(S.ci+1,"full"); break;
    case "summary": renderSummary(); break;
    case "retry": startCase(S.ci); break;
    case "download": download(); break;
    case "reveal":
      u.done=true;
      var keys=st.items.filter(function(x){return x.tag==="key";}).length, got=0;
      u.sel.forEach(function(i){var tg=st.items[i].tag; if(tg==="key")got++; if(tg==="harm")got--;});
      got=Math.max(0,got); r.pts+=got; r.max+=keys; r.log.push(st.title+": "+got+"/"+keys+" claves");
      renderCase(); break;
    case "check":
      u.done=true; var okA=u.pick===st.wrong; r.aiOk=okA; r.pts+=okA?2:0; r.max+=2; r.conf.push({c:u.conf,ok:okA});
      r.log.push("IA: "+(okA?"error detectado":"error no detectado")+" (seguridad "+u.conf+"/5)"); renderCase(); break;
    case "confirm":
      u.done=true; var sc=st.options[u.pick].score; r.pts+=sc; r.max+=2; r.conf.push({c:u.conf,ok:sc===2});
      r.log.push(st.title+": "+sc+"/2 (seguridad "+u.conf+"/5)"); renderCase(); break;
    case "call":
      u.done=true; var h=u.sel.filter(function(i){return st.items[i].key;}).length; r.pts+=h; r.max+=3; r.log.push("Llamada al adjunto: "+h+"/3 datos clave"); renderCase(); break;
  }
});
var projBtn=document.getElementById("projBtn");
projBtn.addEventListener("click",function(e){e.stopPropagation(); if(S.demo) return; var on=document.documentElement.classList.toggle("proj"); projBtn.setAttribute("aria-pressed",on);});

/* ---------- DEMO ---------- */
var demoTimer=null;
var DEMO=[ ["next"],
  ["item",0],["item",1],["item",2],["reveal"],["next"],
  ["item",0],["item",1],["item",2],["reveal"],["next"],
  ["claim",2],["conf",4],["check"],["next"],
  ["opt",0],["conf",4],["confirm"],["next"],
  ["opt",0],["conf",3],["confirm"],["next"],
  ["isb",0],["isb",1],["isb",2],["call"],["next"] ];
var SEL={next:'[data-act="next"]',reveal:'[data-act="reveal"]',check:'[data-act="check"]',confirm:'[data-act="confirm"]',call:'[data-act="call"]',
  item:function(n){return '[data-item="'+n+'"]';},claim:function(n){return '[data-claim="'+n+'"]';},conf:function(n){return '[data-conf="'+n+'"]';},
  opt:function(n){return '[data-opt="'+n+'"]';},isb:function(n){return '[data-isb="'+n+'"]';}};
var WAIT={reveal:2600,check:3200,confirm:2600,call:3400,next:700};
function runDemo(){
  S.demo=true; document.getElementById("demoBanner").classList.add("on");
  startCase(0,"single"); var k=0;
  (function step(){
    if(!S.demo) return;
    if(k>=DEMO.length){ demoTimer=setTimeout(stopDemo,4000); return; }
    var a=DEMO[k++], sel=typeof SEL[a[0]]==="function"?SEL[a[0]](a[1]):SEL[a[0]], el=$(sel);
    if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.classList.add("flash");
      demoTimer=setTimeout(function(){ if(!S.demo) return; el.click(); demoTimer=setTimeout(step, WAIT[a[0]]||650); }, 450);
    } else demoTimer=setTimeout(step,300);
  })();
}
function stopDemo(){ if(!S.demo) return; S.demo=false; clearTimeout(demoTimer); document.getElementById("demoBanner").classList.remove("on"); toast("Demo detenida"); }

/* deep link: #caso=retina */
var m=location.hash.match(/caso=([a-z]+)/);
if(m){ var idx=CASES.map(function(c){return c.id;}).indexOf(m[1]); if(idx>-1){ startCase(idx,"single"); } else renderHome(); }
else renderHome();
})();
</script>
